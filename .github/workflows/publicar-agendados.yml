name: Publicar posts aprovados

on:
  schedule:
    - cron: "7 * * * *"   # de hora em hora, no minuto 7 (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar aprovados com data/hora vencida
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: "17841478285323581"
          IG_MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/media
        run: python3 scripts/ig.py agendados
      - name: Salvar status no calendário
        run: |
          if ! git diff --quiet calendario.json; then
            git config user.name "projecta-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -am "Instagram: atualiza calendário"
            git push
          fi
