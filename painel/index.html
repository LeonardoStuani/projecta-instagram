<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Instagram Projecta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F1EA; --stone:#E7E4DA; --ink:#111110; --muted:#646057; --fog:#A3A097; --line:#D9D5CA;
  --accent:#F04E12; --ok:#1F7A4D; --okbg:#DCEFE3; --warn:#9A6200; --warnbg:#F6E7C4; --err:#B42318; --errbg:#F8DDD8;
  --r:14px; --display:"Bricolage Grotesque",system-ui,sans-serif; --sans:"Instrument Sans",system-ui,sans-serif; --serif:"Instrument Serif",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);letter-spacing:-.03em;line-height:1.05;margin:0;text-wrap:balance}
em.s{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--accent)}
a{color:inherit}
.tag{font-size:13px;font-weight:600;letter-spacing:.01em;color:var(--muted)}
.muted{color:var(--muted)}

/* layout */
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--ink);color:var(--paper);padding:24px 18px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.04em;margin:0 8px 22px}
.brand span{color:var(--accent)}
.nav{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:10px;color:var(--fog);font-weight:500}
.nav:hover{color:var(--paper);background:#1d1c1a}
.nav[aria-current=page]{background:var(--paper);color:var(--ink)}
.nav:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav .n{font-size:12px;background:var(--accent);color:var(--ink);border-radius:99px;padding:0 8px;font-weight:600}
.side-foot{margin-top:auto;font-size:13px;color:var(--fog);padding:0 8px}
.nav-lista{display:flex;flex-direction:column;gap:6px}
.menu-btn{display:none}
code{overflow-wrap:anywhere}
main{padding:32px 40px 80px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:28px}
.top h1{font-size:44px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:500;border:1px solid var(--line);background:#fff8}
.dot{width:8px;height:8px;border-radius:50%;background:var(--fog)}
.dot.ok{background:var(--ok)} .dot.warn{background:#D99A1E} .dot.err{background:var(--err)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:99px;padding:10px 18px;font-weight:600;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;transition:transform .15s,background-color .2s,color .2s}
.btn:hover{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.btn.accent:hover{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* cards */
.grid{display:grid;gap:18px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px}
.card.ink{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.card.ink .muted,.card.ink .tag{color:var(--fog)}
.card h3{font-size:22px;margin-top:6px}
.big{font-family:var(--display);font-weight:700;font-size:56px;letter-spacing:-.05em;line-height:1;margin-bottom:0}

/* next post */
.next{display:grid;grid-template-columns:150px 1fr;gap:22px;align-items:center}
.next img{width:150px;aspect-ratio:4/5;object-fit:cover;border-radius:10px;display:block}
.count{font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:-.04em;color:var(--accent)}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.alert{display:block;padding:10px 12px;border-radius:10px;font-size:14px;cursor:pointer;border:0;text-align:left;width:100%}
.alert.err{background:var(--errbg);color:var(--err)} .alert.warn{background:var(--warnbg);color:var(--warn)} .alert.ok{background:var(--okbg);color:var(--ok)}
.alert b{font-weight:600}

/* mix bar */
.mix{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--stone);margin:12px 0}
.mix span{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px;font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.c-dica{background:#F04E12}.c-bastidores{background:#111110}.c-prova{background:#8C8676}.c-oferta{background:#E9B44C}.c-sem{background:#D9D5CA}

/* weeks */
.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.week{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--paper)}
.week .days{display:flex;gap:4px;margin-top:8px}
.week .d{flex:1;height:28px;border-radius:6px;background:var(--stone);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--muted)}
.week .d.on{background:var(--ink);color:var(--paper)} .week .d.ap{background:var(--ok);color:#fff} .week .d.pub{background:var(--accent);color:var(--ink)}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.cal-head h2{font-size:32px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:#fff;border-radius:var(--r);overflow:hidden}
.cal .wd{padding:8px 10px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper)}
.day{min-height:118px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:5px;transition:background-color .15s}
.day .num{font-size:12px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between}
.day.out{background:#FAF9F5}.day.out .num{color:var(--fog)}
.day.today .num b{background:var(--accent);color:var(--ink);border-radius:99px;padding:0 7px}
.day.slot .num::after{content:"18h";font-weight:500;color:var(--fog)}
.day.over{background:#FDEBE3;outline:2px dashed var(--accent);outline-offset:-4px}
.chip{display:flex;gap:6px;align-items:center;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--fog);border-radius:8px;padding:4px;cursor:grab;font-size:12px;font-weight:500;line-height:1.2;text-align:left;width:100%}
.chip img{width:30px;height:38px;object-fit:cover;border-radius:4px;flex:none}
.chip .t{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chip.pendente{border-left-color:#D99A1E}.chip.aprovado{border-left-color:var(--ok)}.chip.publicado{border-left-color:var(--accent);opacity:.75}.chip.erro{border-left-color:var(--err)}
.chip .x{margin-left:auto;font-size:11px;color:var(--err);font-weight:700;padding-right:2px}
.tray{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;min-height:56px;padding:10px;border:1.5px dashed var(--line);border-radius:var(--r)}
.tray .chip{width:auto;max-width:240px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:99px;padding:2px 10px}
.status.pendente{background:var(--warnbg);color:var(--warn)}.status.aprovado{background:var(--okbg);color:var(--ok)}.status.publicado{background:#FDE3D7;color:#9C2F07}.status.erro{background:var(--errbg);color:var(--err)}

/* drawer */
dialog{border:0;padding:0;max-width:min(1100px,96vw);width:100%;border-radius:20px;background:var(--paper);color:var(--ink);box-shadow:0 30px 80px -20px #0007}
dialog::backdrop{background:#111110aa;backdrop-filter:blur(3px)}
.dlg{display:grid;grid-template-columns:380px 1fr;min-height:600px;max-height:90vh}
.dlg .left{background:var(--stone);padding:28px;display:flex;justify-content:center;align-items:flex-start;overflow:auto}
.dlg .right{padding:28px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.x-close{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:18px}

/* phone */
.phone{width:320px;background:#fff;border-radius:34px;border:8px solid var(--ink);overflow:hidden;box-shadow:0 18px 40px -16px #0006}
.ph-top{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:13px;font-weight:600}
.av{width:30px;height:30px;border-radius:50%;background:var(--ink) center/cover;flex:none;display:grid;place-items:center;color:var(--accent);font-family:var(--display);font-weight:700;font-size:14px}
.ph-media{position:relative;aspect-ratio:4/5;background:var(--stone);overflow:hidden}
.ph-media img,.ph-media video{width:100%;height:100%;object-fit:cover;display:block}
.ph-nav{position:absolute;top:50%;translate:0 -50%;width:28px;height:28px;border-radius:50%;border:0;background:#fffd;cursor:pointer;font-weight:700}
.ph-nav.l{left:8px}.ph-nav.r{right:8px}
.ph-n{position:absolute;top:10px;right:10px;background:#111110bb;color:#fff;font-size:12px;border-radius:99px;padding:1px 8px}
.dots{display:flex;gap:4px;justify-content:center;padding:8px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}.dots i.on{background:#3897f0}
.ph-cap{padding:0 12px 14px;font-size:13px;line-height:1.4;white-space:pre-wrap;max-height:220px;overflow:auto}
.ph-cap b{font-weight:600}

/* form */
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=url],select,textarea{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px}
textarea{min-height:240px;resize:vertical;line-height:1.5}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.checks li{padding:8px 12px;border-radius:10px}
.checks .e{background:var(--errbg);color:var(--err)}.checks .w{background:var(--warnbg);color:var(--warn)}.checks .k{background:var(--okbg);color:var(--ok)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-top:8px;border-top:1px solid var(--line)}
.danger{margin-top:auto;border:1.5px solid var(--err);border-radius:var(--r);padding:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.danger input{max-width:150px}

/* feed */
.feed-wrap{display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:start}
.profile{padding:14px 12px;display:flex;gap:14px;align-items:center;border-bottom:1px solid #eee}
.profile .av{width:64px;height:64px;font-size:26px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;max-height:520px;overflow:auto}
.pgrid button{all:unset;cursor:pointer;position:relative;aspect-ratio:4/5;background:var(--stone)}
.pgrid img{width:100%;height:100%;object-fit:cover;display:block}
.pgrid .lab{position:absolute;left:4px;bottom:4px;font-size:10px;font-weight:600;background:#fffe;border-radius:4px;padding:0 4px}
.pgrid .lab.pub{background:var(--accent)}

/* setup */
.steps{counter-reset:s;display:flex;flex-direction:column;gap:14px}
.step{display:grid;grid-template-columns:44px 1fr;gap:16px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px}
.step .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;background:var(--stone)}
.step.done .ic{background:var(--ok);color:#fff}
.step.cur{border:2px solid var(--accent)}
.step h3{font-size:20px}
.step ol{margin:8px 0;padding-left:20px}.step li{margin:3px 0}
.inline{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.inline input{flex:1;min-width:240px}
code{background:var(--stone);border-radius:6px;padding:1px 6px;font-size:13px}

/* comments */
.cm-post{display:grid;grid-template-columns:90px 1fr;gap:16px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px}
.cm-post img{width:90px;aspect-ratio:4/5;object-fit:cover;border-radius:8px}
.cm{border-top:1px solid var(--line);padding:10px 0}
.cm:first-child{border-top:0}
.reply{margin-top:8px;display:none;gap:8px;flex-direction:column}
.reply.open{display:flex}
.reply textarea{min-height:70px}

.toast{position:fixed;bottom:22px;left:50%;translate:-50% 0;background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:99px;font-weight:500;z-index:99;max-width:90vw;box-shadow:0 10px 30px -10px #0008;opacity:0;transition:opacity .2s,translate .2s;pointer-events:none}
.toast.on{opacity:1;translate:-50% -6px}
.toast.err{background:var(--err);color:#fff}
.empty{padding:30px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r)}
.skip{position:absolute;left:-999px}.skip:focus{left:10px;top:10px;z-index:100;background:#fff;padding:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:1100px){.g3{grid-template-columns:1fr 1fr}.weeks{grid-template-columns:1fr 1fr}.feed-wrap{grid-template-columns:1fr}}
@media (max-width:860px){
  body{overflow-x:clip}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  /* Celular: barra fixa com a marca e um botão Menu que abre todas as seções */
  aside{position:sticky;top:0;z-index:30;height:auto;flex-direction:row;align-items:center;justify-content:space-between;padding:10px 16px;gap:12px}
  .brand{margin:0;font-size:19px}
  .menu-btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;padding:9px 14px;border-radius:99px;background:#232220;color:var(--paper);font-weight:600;font-size:15px}
  .menu-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .menu-dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .menu-ic{position:relative;width:16px;height:2px;background:currentColor;border-radius:2px;transition:background-color .15s}
  .menu-ic::before,.menu-ic::after{content:"";position:absolute;left:0;width:16px;height:2px;background:currentColor;border-radius:2px;transition:transform .18s cubic-bezier(.23,1,.32,1)}
  .menu-ic::before{transform:translateY(-5px)}.menu-ic::after{transform:translateY(5px)}
  aside.aberto .menu-ic{background:transparent}
  aside.aberto .menu-ic::before{transform:rotate(45deg)}aside.aberto .menu-ic::after{transform:rotate(-45deg)}
  .nav-lista{display:none;position:absolute;left:0;right:0;top:100%;background:var(--ink);padding:6px 12px 16px;
    grid-template-columns:1fr 1fr;gap:6px;box-shadow:0 18px 30px -12px #0008;border-top:1px solid #2a2927}
  aside.aberto .nav-lista{display:grid}
  .nav{padding:14px 14px;font-size:16px;background:#1b1a18;color:var(--paper)}
  .side-foot{display:none}
  main{padding:20px 16px 60px}.top h1{font-size:32px}.top{margin-bottom:20px}
  .inline input{min-width:0;flex:1 1 180px}
  .step{grid-template-columns:34px minmax(0,1fr);gap:12px;padding:16px}.step .ic{width:34px;height:34px}
  .step a,.card a{overflow-wrap:anywhere}
  .card{padding:18px}
  .card[style*="grid-template-columns:220px"]{grid-template-columns:1fr!important}
  .next{grid-template-columns:96px 1fr;gap:14px}.next img{width:96px}
  .big{font-size:44px}
  .cm-post{grid-template-columns:64px 1fr;gap:12px;padding:12px}.cm-post img{width:64px}
  .weeks{grid-template-columns:1fr}
  .hb .r{grid-template-columns:minmax(80px,34%) 1fr auto}
  .kpis{grid-template-columns:1fr 1fr}
  .frames{grid-auto-columns:150px}.frame img,.frame .vid,.frame .rec{width:150px}
  .g3,.g2{grid-template-columns:1fr}.g3>*,.g2>*{grid-column:auto!important}
  .dlg{grid-template-columns:1fr}.dlg .left{padding:16px}
  .cal .wd{font-size:10px;padding:6px 4px}.day{min-height:80px;padding:3px}.chip img{display:none}.chip{font-size:10px}
  .row{grid-template-columns:1fr}.phone{width:100%;max-width:320px}
}
/* stories */
.sday{scroll-margin-top:20px}
.sday.hoje{border:2px solid var(--accent)}
.sday-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.frame .sobre{font-size:12.5px;line-height:1.4;color:var(--ink);background:var(--paper);border-radius:8px;padding:6px 8px;margin:0}
.frame .sobre b{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.semana-h{margin:26px 0 12px}.semana-h:first-of-type{margin-top:0}.semana-h h2{margin:0;font-size:20px}
.frames{display:grid;grid-auto-flow:column;grid-auto-columns:170px;gap:14px;overflow-x:auto;padding:14px 2px 6px;scroll-snap-type:x mandatory}
.frame{scroll-snap-align:start;display:flex;flex-direction:column;gap:6px;min-width:0}
.frame .n{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.frame img,.frame .vid{width:170px;aspect-ratio:9/16;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;background:#111}
.frame .rec{width:170px;aspect-ratio:9/16;border-radius:10px;background:var(--ink);color:var(--paper);padding:12px;font-size:12px;line-height:1.35;display:flex;flex-direction:column;gap:8px;overflow:auto}
.frame .rec b{color:var(--accent);font-size:13px}
.frame .ad{font-size:12px;line-height:1.3;background:#EFEAFE;color:#4B2FB8;border-radius:8px;padding:5px 7px}
.frame .lk{display:flex;gap:4px}.frame .lk input{min-width:0;flex:1;font-size:11px;padding:4px 6px;border:1px solid var(--line);border-radius:6px}
.status.hoje{background:#FDE3D7;color:#9C2F07}.status.prox{background:var(--paper);color:var(--muted)}.status.atrasado{background:var(--warnbg);color:var(--warn)}.status.postado{background:var(--okbg);color:var(--ok)}
.chip.story{border-left-color:#7A5AF8;cursor:pointer}
/* radar */
.grid>.card{min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.kpi{background:var(--paper);border-radius:12px;padding:14px 16px}.kpi b{display:block;font-size:28px;font-family:"Bricolage Grotesque",sans-serif;letter-spacing:-.02em;margin-top:4px}
.kpi span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.kpi small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.chart{width:100%;height:auto;display:block;margin-top:12px;overflow:visible}
.chart text{font-size:11px;fill:var(--muted)}
.chart .bar{fill:#C9C4B8}.chart .bar.top{fill:var(--accent)}.chart .bar:hover{opacity:.8}
.chart .med{stroke:var(--ink);stroke-width:1;stroke-dasharray:4 4;opacity:.55}
.hb{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.hb .r{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;font-size:13px}
.hb .t{background:var(--paper);border-radius:4px;height:14px;overflow:hidden}.hb .t i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.hb .v{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.rlist{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:8px}
.rlist li{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:start;background:var(--paper);border-radius:10px;padding:10px 12px}
.rlist .m{font-family:"Bricolage Grotesque",sans-serif;font-size:20px;font-weight:700;color:var(--accent)}
.rlist .m.low{color:var(--muted)}
.rlist p{margin:0;font-size:14px;line-height:1.35}.rlist small{color:var(--muted);font-size:12px}
.rlist a{color:inherit}
.fchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.fchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tag-tema{display:inline-block;font-size:11px;background:#EFEAFE;color:#4B2FB8;border-radius:6px;padding:1px 6px;margin-right:4px}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;line-height:1.4;padding:6px 9px;border-radius:8px;max-width:280px;z-index:99;opacity:0;transition:opacity .1s}
/* agência: troca de conta, clientes, pedidos */
.conta-sel{margin:-8px 8px 16px;grid-column:1/-1}
.conta-sel label{color:var(--fog);font-size:12px;font-weight:600;margin-bottom:6px}
.conta-sel select{background:#1d1c1a;color:var(--paper);border:1.5px solid #3a3833;font-weight:600;cursor:pointer}
.conta-sel select option{color:var(--ink);background:#fff}
body.modo-cliente .conta-sel select{border-color:var(--accent)}
.nav[hidden]{display:none}
.status.aguardando_cliente{background:#E3EAFB;color:#2349A0}.status.ajuste{background:var(--errbg);color:var(--err)}.status.aprovado_cliente{background:#E5F4EA;color:#17603C;box-shadow:inset 0 0 0 1px #9FD3B4}
.chip.aguardando_cliente{border-left-color:#3B6FD8}.chip.ajuste{border-left-color:var(--err)}.chip.aprovado_cliente{border-left-color:#7BC59B}
.fluxo{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:12px}
.etapa{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:2px;background:var(--paper)}
.etapa b{font-family:var(--display);font-size:34px;letter-spacing:-.04em;line-height:1;font-weight:700}
.etapa span{font-weight:600}.etapa small{color:var(--muted);font-size:12px}
.etapa:hover{border-color:var(--ink)}.etapa:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.etapa.aguardando_cliente b{color:#2349A0}.etapa.ajuste b{color:var(--err)}.etapa.aprovado_cliente b,.etapa.aprovado b{color:var(--ok)}
.pedir{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:8px}
.pedir li{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--paper);border-radius:10px;padding:6px 6px 6px 12px}
.pedir code{background:none;padding:0;font-size:13px;overflow-wrap:anywhere}
.clis{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.cli{display:flex;flex-direction:column}
.cli-top{display:flex;gap:12px;align-items:center}
.cli h3{font-size:22px;margin:0}
.big-av{width:48px;height:48px;font-size:20px}
.mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.mini span{display:flex;flex-direction:column;background:var(--paper);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--muted);min-width:64px}
.mini b{font-family:var(--display);font-size:20px;color:var(--ink);line-height:1.1}
.mini .on.ajuste b{color:var(--err)}.mini .on.aprovado_cliente b,.mini .on.aprovado b{color:var(--ok)}.mini .on.aguardando_cliente b{color:#2349A0}
.cli.novo{border-style:dashed;background:#fffc}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row2 .full{grid-column:1/-1}
.passos{margin:10px 0 0;padding-left:20px;line-height:1.7}
.ped-top{display:flex;gap:16px;justify-content:space-between;align-items:flex-start}
.pst{width:auto;min-width:150px;font-weight:600}
.ped.novo{border-left:4px solid var(--accent)}.ped.concluido,.ped.recusado{opacity:.72}
.anexos{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.anx{width:92px;height:92px;border-radius:10px;overflow:hidden;background:var(--stone);display:grid;place-items:center;font-weight:600;font-size:13px;color:var(--ink);text-decoration:none}
.anx img{width:100%;height:100%;object-fit:cover}
.conversa{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.conversa p{margin:0;padding:8px 12px;border-radius:12px;font-size:14px;max-width:80%}
.conversa .dele{background:var(--paper);align-self:flex-start}.conversa .nossa{background:#FDE3D7;align-self:flex-end}
.conversa small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.hist{font-size:14px}.hist summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.hist ul{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.hist li{border-left:2px solid var(--line);padding-left:10px}.hist li.dele{border-left-color:var(--accent)}
.hist small{color:var(--muted)}
@media (max-width:860px){.fluxo{grid-template-columns:repeat(2,minmax(0,1fr))}.row2{grid-template-columns:1fr}.ped-top{flex-direction:column}.pst{width:100%}.conta-sel{margin:4px 0 10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#conteudo">Pular para o conteúdo</a>
<div class="app">
  <aside>
    <div class="brand">projecta<span>.</span>insta</div>
    <button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="nav-lista"><span id="menu-atual">Hoje</span><i class="menu-dot" id="menu-dot" hidden></i><span class="menu-ic" aria-hidden="true"></span><span class="sr">Abrir menu</span></button>
    <nav class="nav-lista" id="nav-lista" aria-label="Seções do painel">
    <div class="conta-sel"><label for="cli-sel">Conta</label><select id="cli-sel"><option>Projecta Tech</option></select></div>
    <button class="nav" data-view="hoje" aria-current="page">Hoje</button>
    <button class="nav" data-view="calendario">Calendário</button>
    <button class="nav" data-view="pedidos" hidden>Pedidos <span class="n" id="pd-n" hidden></span></button>
    <button class="nav" data-view="stories">Stories <span class="n" id="st-n" hidden></span></button>
    <button class="nav" data-view="radar">Radar</button>
    <button class="nav" data-view="feed">Prévia do feed</button>
    <button class="nav" data-view="comentarios">Comentários</button>
    <button class="nav" data-view="config">Conexões <span class="n" id="cfg-n" hidden></span></button>
    <button class="nav" data-view="clientes">Clientes <span class="n" id="cl-n" hidden></span></button>
    </nav>
    <div class="side-foot" id="side-foot">Nada vai ao ar sem a sua aprovação.<br>Rodando só neste computador.</div>
  </aside>
  <main id="conteudo" tabindex="-1">
    <div class="top">
      <div><p class="tag" id="agora"></p><h1 id="titulo">Hoje</h1></div>
      <div class="pills" id="pills"></div>
    </div>
    <section id="view"></section>
  </main>
</div>

<dialog id="dlg" aria-labelledby="dlg-t"><div style="position:relative"><button class="x-close" aria-label="Fechar" onclick="dlg.close()">×</button><div id="dlg-body"></div></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="tip" aria-hidden="true"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const file = p => "/arquivo?p=" + encodeURIComponent(p) + (CLI ? "&cliente=" + encodeURIComponent(CLI) : "");
const comCli = path => CLI ? path + (path.includes("?") ? "&" : "?") + "cliente=" + encodeURIComponent(CLI) : path;
const PIL = {dica:"Dica", bastidores:"Bastidores", prova:"Prova / antes-depois", oferta:"Oferta"};
const ST = {pendente:"Pendente", aprovado:"Aprovado", publicado:"Publicado", erro:"Erro", aguardando_cliente:"Com o cliente", ajuste:"Ajuste pedido", aprovado_cliente:"Cliente aprovou"};
const stLbl = s => CLI && s === "pendente" ? "Rascunho" : CLI && s === "aprovado" ? "Agendado" : ST[s] || s;
const WD = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
let S = null, view = "hoje", mes = null;
let CLI = (() => { try { return localStorage.getItem("cli") || ""; } catch { return ""; } })();   // "" = @projectatech

async function api(path, body) {
  const opt = body === undefined ? {} : {method:"POST", headers:{"Content-Type":"application/json","X-Painel":"1"}, body:JSON.stringify(body)};
  const r = await fetch(comCli(path), opt);
  const j = await r.json().catch(() => ({erro:"Resposta inválida do painel."}));
  if (!r.ok) throw new Error(j.erro || "Erro");
  return j;
}
function toast(msg, err) {
  const t = $("#toast"); t.textContent = msg; t.className = "toast on" + (err ? " err" : "");
  clearTimeout(t._h); t._h = setTimeout(() => t.className = "toast", err ? 6000 : 3200);
}
async function run(btn, fn, ok) {
  const old = btn?.textContent; if (btn) { btn.disabled = true; btn.textContent = "Aguarde…"; }
  try { const r = await fn(); if (ok) toast(typeof ok === "function" ? ok(r) : ok); await load(); return r; }
  catch (e) { toast(e.message, true); }
  finally { if (btn) { btn.disabled = false; btn.textContent = old; } }
}

const dt = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fmt = s => s ? dt(s).toLocaleDateString("pt-BR", {weekday:"short", day:"2-digit", month:"2-digit"}) : "sem data";
const agoraDate = () => { const [d,h] = S.agora.split(" "); const x = dt(d); const [hh,mm] = h.split(":"); x.setHours(+hh, +mm); return x; };
const quando = p => { const x = dt(p.data); const [h,m] = (p.hora||"18:00").split(":"); x.setHours(+h,+m); return x; };

async function load() {
  S = await api("/api/estado");
  $("#agora").textContent = (CLI ? S.cliente.nome + " · " : "") + "Brasília · " + new Date(S.agora.replace(" ","T")).toLocaleString("pt-BR", {weekday:"long", day:"2-digit", month:"long", hour:"2-digit", minute:"2-digit"});
  switcher(); CLI ? pillsCli() : pills(); render();
}

function secretOk() { try { return localStorage.getItem("secretOk") === "1"; } catch { return false; } }
function setupSteps() {
  const t = S.token, g = S.git;
  return [
    {k:"python", ok: !!S.pillow},
    {k:"github", ok: g.repo && !!g.remote && t.base_url_ok},
    {k:"token", ok: t.valido},
    {k:"secret", ok: !!(g.repo && g.remote && secretOk())},
    {k:"envio", ok: g.repo && g.remote && g.alteracoes === 0 && g.a_enviar === 0},
  ];
}
const pl = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
const nomePost = id => { const t = String(id || "").replace(/^[0-9]+-/, "").replace(/-/g, " "); return t.charAt(0).toUpperCase() + t.slice(1); };
function pills() {
  const t = S.token, g = S.git;
  const tokCls = t.valido ? "ok" : "err";
  const tokTxt = !t.configurado ? "Instagram desconectado" : !t.valido ? "Token recusado pela Meta" : `@${t.conta || "conectado"} · conectado`;
  const gCls = !g.repo || !g.remote ? "err" : g.alteracoes || g.a_enviar ? "warn" : "ok";
  const gTxt = !g.repo || !g.remote ? "GitHub não conectado" : g.alteracoes || g.a_enviar ? `${pl(g.alteracoes || g.a_enviar, "alteração não enviada", "alterações não enviadas")}` : "GitHub em dia";
  $("#pills").innerHTML = `<span class="pill"><i class="dot ${tokCls}"></i>${tokTxt}</span><span class="pill"><i class="dot ${gCls}"></i>${gTxt}</span>` +
    (g.repo && g.remote && (g.alteracoes || g.a_enviar) ? `<button class="btn sm accent" id="push">Enviar para o GitHub</button>` : "");
  $("#push")?.addEventListener("click", e => run(e.currentTarget, () => api("/api/github/enviar", {}), "Enviado. O robô do GitHub publica os aprovados no horário."));
  const falta = setupSteps().filter(s => !s.ok).length;
  const n = $("#cfg-n"); n.hidden = !falta; n.textContent = falta;
}

function render() {
  SUJO = false;  // tela nova: nada digitado ainda
  if (!S) return;  // clique numa aba antes do painel terminar de carregar
  document.querySelectorAll(".nav").forEach(b => { if (b.dataset.view === view) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  $(`.nav[data-view="pedidos"]`).hidden = !CLI;
  if (!CLI && view === "pedidos") view = "hoje";
  const titles = {hoje:"Hoje", calendario:"Calendário", stories:"Stories", radar:"Radar do Instagram", feed:"Prévia do feed", comentarios:"Comentários", config: CLI ? "Conexões do cliente" : "Conexões", clientes:"Clientes da agência", pedidos:"Pedidos do cliente"};
  $("#titulo").textContent = titles[view];
  $("#menu-atual").textContent = $(`.nav[data-view="${view}"]`).firstChild.textContent.trim();
  ({hoje: CLI ? vHojeCli : vHoje, calendario:vCal, stories:vStories, radar:vRadar, feed:vFeed, comentarios:vComent, config: CLI ? vConfigCli : vConfig, clientes:vClientes, pedidos:vPedidos})[view]();
  const pend = storyDias().filter(x => x.st === "hoje" || x.st === "atrasado").length;
  const n = $("#st-n"); n.hidden = !pend; n.textContent = pend;
  $("#menu-dot").hidden = $("#st-n").hidden && $("#cfg-n").hidden && $("#pd-n").hidden && $("#cl-n").hidden;
}

/* ---------- STORIES ---------- */
// Postados à mão pelo app (a API não coloca enquete, caixinha nem link). O painel organiza, mostra e marca.
function storyDias() {
  const hoje = iso(agoraDate()), out = [];
  for (const s of S.stories || []) for (const d of s.dias) {
    const st = d.postado ? "postado" : d.data === hoje ? "hoje" : d.data < hoje ? "atrasado" : "prox";
    out.push({s, d, st});
  }
  return out;
}
const STS = {postado:"Postado", hoje:"Hoje", atrasado:"Não postado", prox:"Próximo"};
function vStories() {
  const dias = storyDias();
  if (!dias.length) { $("#view").innerHTML = `<div class="card"><p class="muted">Nenhuma semana de Stories${CLI ? ` de ${esc(S.cliente.nome)}` : ""}. Peça ao Claude "${CLI ? `/agencia ${esc(S.cliente.slug)} stories da semana` : "/ig-story da semana"}".</p></div>`; return; }
  $("#view").innerHTML = `
  <p class="muted" style="margin:0 0 16px">Stories vão pelo <b>app do Instagram</b>, porque a API não coloca enquete, caixinha nem link. Aqui você vê o que postar, salva as imagens (no celular, toque e segure) e marca como postado.${CLI ? " Quadros \"Você grava\" usam foto ou vídeo do cliente (peça pelo portal). Se o cliente posta sozinho, mande as imagens para ele." : " O quadro 1 agora vem pronto como vídeo animado: é só baixar e postar (a localização você coloca no app)."}</p>
  ${dias.map(({s, d, st}, i) => `${i === 0 || dias[i - 1].s !== s ? `<div class="semana-h"><h2>${esc(s.titulo || s.semana)}</h2>${s.resumo ? `<p class="muted" style="margin:4px 0 0">${esc(s.resumo)}</p>` : ""}</div>` : ""}
  <div class="card sday ${st === "hoje" ? "hoje" : ""}" id="st-${esc(s.semana)}-${d.n}" style="margin-bottom:16px">
    <div class="sday-h"><div><p class="tag">Dia ${d.n} · ${fmt(d.data)}${d.horario ? ` · postar ${esc(d.horario)}` : ""}</p><h3>${esc(d.titulo)}</h3></div>
      <div class="inline" style="margin:0;align-items:center"><span class="status ${st}">${STS[st]}</span>
      <button class="btn sm ${d.postado ? "ghost" : "accent"}" data-mark="${esc(s.semana)}|${d.n}|${d.postado ? 0 : 1}">${d.postado ? "Desmarcar" : "Marcar como postado"}</button></div></div>
    <div class="frames">${d.quadros.map(q => `<div class="frame"><span class="n">QUADRO ${q.n}</span>
      ${q.img ? `<a href="${file(q.img)}" target="_blank" rel="noopener" title="Abrir em tamanho real"><img src="${file(q.img)}" alt="Story ${d.n}, quadro ${q.n}" loading="lazy"></a>
        <a class="btn ghost sm" href="${file(q.img)}" download="story-dia${d.n}-${q.n}.png">Baixar</a>`
      : q.video ? `<video class="vid" src="${file(q.video)}" muted loop playsinline autoplay preload="metadata" aria-label="Story ${d.n}, quadro ${q.n} (vídeo animado)"></video>
        <a class="btn ghost sm" href="${file(q.video)}" download="story-dia${d.n}-${q.n}.mp4">Baixar vídeo</a>${q.voz ? `<span class="muted" style="font-size:12px;display:block;margin-top:4px">🎙️ Com narração: ligue o som</span>` : ""}`
      : `<div class="rec"><b>🎥 Você grava</b>${esc(q.texto)}</div>`}
      ${q.sobre ? `<p class="sobre"><b>O que é</b>${esc(q.sobre)}</p>` : ""}
      ${q.adesivo ? `<span class="ad">${esc(q.adesivo)}</span>` : ""}
      ${q.link ? `<span class="lk"><input readonly value="${esc(q.link)}" aria-label="Link do adesivo"><button class="btn sm" data-copy="${esc(q.link)}">Copiar</button></span>` : ""}
    </div>`).join("")}</div>
    ${d.depois ? `<p class="muted" style="margin:8px 0 0;font-size:14px"><b>Depois:</b> ${esc(d.depois)}</p>` : ""}
  </div>`).join("")}`;
  document.querySelectorAll("[data-mark]").forEach(b => b.onclick = () => {
    const [semana, dia, v] = b.dataset.mark.split("|");
    run(b, () => api("/api/stories/marcar", {semana, dia: +dia, postado: v === "1"}), v === "1" ? "Stories marcados como postados." : "Desmarcado.");
  });
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
    const inp = b.previousElementSibling;
    try { await navigator.clipboard.writeText(b.dataset.copy); }
    catch { inp.select(); document.execCommand("copy"); }
    toast("Link copiado. Cole no adesivo de link do Story.");
  });
  const alvo = location.hash.split("/")[1] || (dias.find(x => x.st === "hoje") && `${dias.find(x => x.st === "hoje").s.semana}-${dias.find(x => x.st === "hoje").d.n}`);
  if (alvo) document.getElementById("st-" + alvo)?.scrollIntoView({block:"start"});
}
function storiesCard() {
  const h = storyDias().find(x => x.d.data === iso(agoraDate()));
  if (!h) return "";
  const imgs = h.d.quadros.filter(q => q.img).slice(0, 4);
  return `<div class="card" style="margin-top:18px"><div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start">
    <div><p class="tag">Stories de hoje · pelo app</p><h3>${esc(h.d.titulo)}</h3>
    <p class="muted" style="margin:6px 0 0">${h.d.quadros.length} quadros · ${h.d.quadros.some(q=>q.video)?"quadro 1 em vídeo pronto":"quadro 1 você grava"} · <span class="status ${h.st}">${STS[h.st]}</span></p></div>
    <button class="btn ${h.d.postado ? "ghost" : "accent"} sm" id="st-go">Abrir Stories de hoje</button></div>
    <div class="frames" style="grid-auto-columns:96px">${imgs.map(q => `<img src="${file(q.img)}" alt="" style="width:96px;border-radius:8px;border:1px solid var(--line)">`).join("")}</div></div>`;
}

/* ---------- HOJE ---------- */
function alertas() {
  const out = [], now = agoraDate(), em7 = new Date(now); em7.setDate(em7.getDate() + 7);
  const t = S.token;
  if (!t.configurado) out.push({c:"err", t:"<b>Instagram desconectado.</b> Conecte o token para publicar e ver comentários.", go:"config"});
  else if (!t.valido) out.push({c:"err", t:"<b>A conexão com o Instagram falhou.</b> Abra Conexões e clique em Testar conexão.", go:"config"});
  if (!S.git.repo || !S.git.remote) out.push({c:"err", t:"<b>GitHub não conectado.</b> Sem ele, os aprovados não saem sozinhos.", go:"config"});
  const rd = S.radar || {};
  if (!rd.rodando && (rd.dias == null || rd.dias > 7)) out.push({c:"warn", t:`<b>Radar ${rd.dias == null ? "nunca rodou" : `com ${rd.dias} dias`}.</b> Atualize na aba Radar (leva menos de 1 minuto).`, go:"radar"});
  for (const p of S.posts) {
    if (p.status === "publicado") continue;
    if (p.status === "erro") out.push({c:"err", t:`<b>${esc(nomePost(p.id))} deu erro ao publicar.</b> ${esc(p.erro || "")}`, id:p.id});
    if (!p.data) continue;
    const q = quando(p);
    if (q < now && p.status !== "publicado") out.push({c:"err", t:`<b>${esc(nomePost(p.id))}</b> estava marcado para ${fmt(p.data)} e não saiu. Mude a data ou publique.`, id:p.id});
    else if (q <= em7 && p.status === "pendente") {
      const e = p.checagem.erros.length;
      out.push({c: e ? "err" : "warn", t:`<b>${esc(nomePost(p.id))}</b> sai ${fmt(p.data)} e ainda está pendente${e ? ` · ${pl(e, "problema para corrigir", "problemas para corrigir")}` : ". Revise e aprove."}`, id:p.id});
    }
  }
  for (const x of storyDias()) {

  const lista = () => {
    const rs = (R.referencias || []).filter(r => RF.fonte.has(r.fonte) && (!RF.tema || r.temas.includes(RF.tema))).slice(0, 30);
    $("#rf-list").innerHTML = rs.map(r => `<li><span class="m">${mx(r.mult)}</span><div><p>${r.link ? `<a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.gancho || "(sem legenda)")}</a>` : esc(r.gancho)}</p>
      <small>${r.temas.map(t => `<span class="tag-tema">${esc(t)}</span>`).join("")}${r.fonte === "youtube" ? "YouTube · " : "@"}${esc(r.conta || "?")} · ${esc(r.tipo)}${r.data ? " · " + fd(r.data) : ""}${r.likes != null ? ` · ${nf(r.likes)} curtidas` : ""}${r.comentarios != null ? ` · ${nf(r.comentarios)} coment.` : ""}${r.views ? ` · ${nf(r.views)} views` : ""}</small></div></li>`).join("")
      || `<li><span></span><p class="muted">${(R.referencias || []).length ? "Nada com esse filtro." : P.contas_nicho ? "Nenhum post do nicho nas contas monitoradas. Adicione mais contas ao lado." : "As contas do nicho entram quando a permissão do token for liberada. Enquanto isso, use a coleta manual."}</p></li>`;
  };

  if (CLI) { $("#rd-pal-wrap")?.remove(); }
  salvarConf();
  bindRadar();
}

/* ---------- CALENDÁRIO ---------- */
function chip(p, drag = true) {
  const x = p.checagem?.erros?.length ? `<span class="x" title="${pl(p.checagem.erros.length, "problema", "problemas")}">!</span>` : "";
  return `<button class="chip ${p.status} open" data-id="${esc(p.id)}" ${drag && p.status !== "publicado" ? `draggable="true"` : ""}>
    ${p.midia[0] && !p.midia[0].endsWith(".mp4") ? `<img src="${file(p.midia[0])}" alt="">` : ""}<span class="t">${esc(nomePost(p.id))}</span>${x}</button>`;
}
function vCal() {
  const now = agoraDate();
  if (!mes) mes = new Date(now.getFullYear(), now.getMonth(), 1);
  const ini = new Date(mes); ini.setDate(1 - ini.getDay());
  const cells = [];
  for (let i = 0; i < 42; i++) { const d = new Date(ini); d.setDate(ini.getDate() + i); cells.push(d); }
  const hoje = iso(now);
  const semData = S.posts.filter(p => !p.data);
  $("#view").innerHTML = `
  <div class="cal-head">
    <h2>${mes.toLocaleDateString("pt-BR",{month:"long", year:"numeric"}).replace(/^\w/, c => c.toUpperCase())}</h2>
    <div class="inline" style="margin:0"><button class="btn ghost sm" id="m-ant">← Mês anterior</button><button class="btn ghost sm" id="m-hoje">Hoje</button><button class="btn ghost sm" id="m-prox">Próximo mês →</button></div>
  </div>
  <p class="muted" style="margin:-4px 0 14px">Arraste um post para outro dia para reagendar. Se ele estava aprovado, volta para pendente.</p>
  <div class="cal">${WD.map(w => `<div class="wd">${w}</div>`).join("")}
  ${cells.map(d => { const k = iso(d); const ps = S.posts.filter(p => p.data === k); const slot = [1,3,5].includes(d.getDay());
    const sts = storyDias().filter(x => x.d.data === k);
    return `<div class="day ${d.getMonth() !== mes.getMonth() ? "out" : ""} ${k === hoje ? "today" : ""} ${slot && !ps.length && d >= now ? "slot" : ""}" data-date="${k}"><span class="num"><b>${d.getDate()}</b></span>${ps.map(p => chip(p)).join("")}${sts.map(x => `<button class="chip story" data-story="${esc(x.s.semana)}-${x.d.n}" title="${esc(x.d.titulo)}"><span class="t">Stories · ${x.d.postado ? "✓ " : ""}${esc(x.d.titulo)}</span></button>`).join("")}</div>`; }).join("")}
  </div>
  <div class="grid g2" style="margin-top:22px">
    <div><p class="tag">Sem data</p><div class="tray" data-date="">${semData.map(p => chip(p)).join("") || `<span class="muted">Arraste um post aqui para tirar a data.</span>`}</div></div>
    <div><p class="tag">Pastas novas em posts/ (ainda fora do calendário)</p><div class="tray">${S.novas.map(n => `<div class="chip" style="cursor:default">${n.capa ? `<img src="${file(n.capa)}" alt="">` : ""}<span class="t">${esc(n.pasta)} · ${n.video ? "reel" : n.n + " slide(s)"}</span><button class="btn sm" data-prep="${esc(n.pasta)}" style="margin-left:6px">Preparar</button></div>`).join("") || `<span class="muted">Nenhuma. Crie a pasta com slide-01.png… e legenda.md.</span>`}</div></div>
  </div>`;
  $("#m-ant").onclick = () => { mes.setMonth(mes.getMonth() - 1); vCal(); };
  $("#m-prox").onclick = () => { mes.setMonth(mes.getMonth() + 1); vCal(); };
  $("#m-hoje").onclick = () => { mes = null; vCal(); };
  document.querySelectorAll("[data-prep]").forEach(b => b.onclick = () => prepDialog(b.dataset.prep));
  document.querySelectorAll("[data-story]").forEach(b => b.onclick = () => { location.hash = "stories/" + b.dataset.story; view = "stories"; render(); });
  document.querySelectorAll(".chip[draggable]").forEach(c => c.addEventListener("dragstart", e => e.dataTransfer.setData("text/plain", c.dataset.id)));
  document.querySelectorAll("[data-date]").forEach(z => {
    z.addEventListener("dragover", e => { e.preventDefault(); z.classList.add("over"); });
    z.addEventListener("dragleave", () => z.classList.remove("over"));
    z.addEventListener("drop", async e => {
      e.preventDefault(); z.classList.remove("over");
      const id = e.dataTransfer.getData("text/plain"); if (!id) return;
      await run(null, () => api("/api/post/salvar", {id, data: z.dataset.date}), r => r.aviso || (z.dataset.date ? `Reagendado para ${fmt(z.dataset.date)}.` : "Data removida."));
    });
  });
  bindOpen();
}

  return `<div class="phone"><div class="ph-top"><span class="av">${esc(inicial())}</span>${esc(contaAtual())}<span class="muted" style="font-weight:400;margin-left:auto">${esc(cidadeAtual())}</span></div>
  <div class="ph-media">${isV ? `<video src="${file(cur)}" controls muted playsinline></video>` : `<img src="${file(cur)}" alt="Slide ${i+1} de ${m.length}">`}
  ${m.length > 1 ? `<span class="ph-n">${i+1}/${m.length}</span>${i > 0 ? `<button class="ph-nav l" data-go="${i-1}" aria-label="Slide anterior">‹</button>` : ""}${i < m.length-1 ? `<button class="ph-nav r" data-go="${i+1}" aria-label="Próximo slide">›</button>` : ""}` : ""}</div>
  ${m.length > 1 ? `<div class="dots">${m.map((_,k) => `<i class="${k===i?"on":""}"></i>`).join("")}</div>` : `<div style="height:10px"></div>`}

}
function checksHtml(c) {
  const li = [...c.erros.map(e => `<li class="e">✕ ${esc(e)}</li>`), ...c.avisos.map(a => `<li class="w">! ${esc(a)}</li>`)];
  return li.length ? li.join("") : `<li class="k">✓ Dentro das regras do voice.md</li>`;
}
function openPost(id) {

  $("#f-s")?.addEventListener("click", e => run(e.currentTarget, salvar, r => r.aviso || "Salvo.").then(() => openPost(p.id)));

  $("#f-env")?.addEventListener("click", e => run(e.currentTarget, async () => { if (dirty()) await salvar(); return api("/api/post/enviar-cliente", {id: p.id, nota: $("#f-nota")?.value || ""}); },
    "Enviado. Avise o cliente no WhatsApp que tem post para aprovar.").then(r => r && openPost(p.id)));
  $("#f-apc")?.addEventListener("click", e => confirm("Registrar que o cliente aprovou fora do portal (WhatsApp, ligação)?") && run(e.currentTarget, () => api("/api/portal/aprovar?c=" + encodeURIComponent(CLI), {id: p.id, texto: "Aprovado fora do portal."}), "Aprovação registrada.").then(r => r && openPost(p.id)));
  $("#f-u")?.addEventListener("click", e => run(e.currentTarget, () => api("/api/post/pendente", {id: p.id}), "Voltou para pendente.").then(() => openPost(p.id)));

  $("#f-pub")?.addEventListener("click", e => run(e.currentTarget, async () => { if (dirty()) await salvar(); return api("/api/post/publicar", {id: p.id, confirmacao: $("#f-cf").value}); },

  if (!dlg.open) dlg.showModal();
}
function histHtml(p) {

}
function acoesCli(p) {
  const s = p.status, err = p.checagem.erros.length, nota = ultimaFala(p, "cliente");

  if (["pendente", "ajuste", "erro"].includes(s)) bt = `<button class="btn accent" id="f-env" ${err ? "disabled title='Corrija os itens em vermelho'" : ""}>Enviar para ${esc(S.cliente.nome)} aprovar</button>`;
  else if (s === "aguardando_cliente") bt = `<span class="status aguardando_cliente">Esperando o cliente no portal</span><button class="btn ghost sm" id="f-apc">Cliente aprovou por fora</button>`;
  else if (s === "aprovado_cliente") bt = `<button class="btn accent" id="f-a" ${err ? "disabled" : ""}>Agendar para ${p.data ? fmt(p.data) + " " + p.hora : "a data"}</button><button class="btn ghost sm" id="f-u">Voltar para rascunho</button>`;
  else if (s === "aprovado") bt = `<button class="btn ghost" id="f-u">Desagendar</button>`;
  const dica = {pendente:"Enviar coloca o post no portal do cliente. Se editar depois, ele volta para rascunho.", ajuste:"Ajuste, salve e envie de novo.", erro:"Corrija e envie de novo.",
    aguardando_cliente:"Se editar agora, o post sai do portal e volta para rascunho.", aprovado_cliente:"Agendar libera a publicação automática no horário.", aprovado:"Sai sozinho no horário (o painel precisa estar aberto)."}[s] || "";
  return `${s === "ajuste" && nota ? `<p class="alert err" style="cursor:default;margin:0"><b>O cliente pediu:</b> ${esc(nota)}</p>` : ""}
    ${["pendente", "ajuste", "erro"].includes(s) ? `<div><label for="f-nota">Recado junto do post <span class="muted" style="font-weight:400">(opcional, o cliente vê)</span></label><input type="text" id="f-nota" placeholder="Ex.: usei a foto da obra de outubro"></div>` : ""}

    ${histHtml(p)}
    ${["aprovado_cliente", "aprovado"].includes(s) ? `<div class="danger"><div style="flex:1;min-width:200px"><b>Publicar agora</b><p class="muted" style="margin:2px 0 0;font-size:13px">Vai direto para o @${esc(contaAtual())}. Só posts que o cliente aprovou.</p></div>
      <label class="sr" for="f-cf">Digite PUBLICAR</label><input type="text" id="f-cf" placeholder="digite PUBLICAR" autocomplete="off"><button class="btn sm" id="f-pub" disabled>Publicar</button></div>` : ""}`;

/* ---------- COMENTÁRIOS ---------- */
// A busca leva alguns segundos. Se você trocar de aba antes de terminar, a resposta é descartada
// (antes ela escrevia os comentários por cima da aba nova). Guarda 2 min em memória para não buscar a cada clique.
// Uma busca em andamento é reaproveitada: se o painel redesenhar no meio, não recomeça do zero.
let comentSeq = 0, comentCache = null, comentBusca = null;
async function vComent(forcar) {
  if (CLI ? !S.conexao.conectado : !S.token.configurado) { $("#view").innerHTML = `<div class="empty">Conecte o Instagram em <b>Conexões</b> para ver os comentários.<div class="inline" style="justify-content:center"><button class="btn" onclick="go('config')">Ir para Conexões</button></div></div>`; return; }
  const meu = ++comentSeq;
  const fresco = !forcar && comentCache && Date.now() - comentCache.t < 120000;
  if (!fresco) $("#view").innerHTML = `<p class="muted">Carregando comentários dos 8 posts mais recentes…</p>`;
  try {
    if (!fresco && (forcar || !comentBusca)) comentBusca = api("/api/comentarios").finally(() => { comentBusca = null; });
    const r = fresco ? comentCache.r : await comentBusca;
    if (meu !== comentSeq || view !== "comentarios") return;
    comentCache = {t: Date.now(), r};
    const itens = r.itens.filter(i => i.comentarios.length);
    $("#view").innerHTML = `<p class="muted" style="margin-top:0">Rascunhe a resposta no Claude com <code>/ig-reply</code> ou escreva aqui. Nada é enviado sem você confirmar.</p>
    <div class="grid">${itens.map(i => `<div class="cm-post"><img src="${esc(i.post.thumbnail_url || i.post.media_url || "")}" alt=""><div>

    run(e.currentTarget, () => api("/api/conexao/token", {token: tok}), r => `Conectado como @${r.conta.username}. Cole o mesmo token no secret do GitHub.`); };
  $("#tk-test")?.addEventListener("click", e => run(e.currentTarget, () => api("/api/conexao/testar", {}), r => `Conexão OK: @${r.conta.username} · ${r.conta.media_count} posts · ${r.conta.followers_count ?? "?"} seguidores.`));

const TIPOS = {post:"Post no feed", story:"Story", reel:"Reel", sugestao:"Sugestão de assunto", outro:"Outro"};
const PST = {novo:"Novo", em_producao:"Em produção", concluido:"Concluído", recusado:"Recusado"};

const cidadeAtual = () => CLI ? (S.cliente?.cidade || "") : "Lages-SC";
const inicial = () => (CLI ? (S.cliente?.nome || CLI) : "P").trim().charAt(0).toUpperCase();
const ultimaFala = (p, quem) => [...(p.historico || [])].reverse().find(h => h.quem.startsWith(quem) && h.texto)?.texto || "";
async function copiar(t, msg) { try { await navigator.clipboard.writeText(t); toast(msg || "Copiado."); } catch { prompt("Copie:", t); } }

function setCli(v) {
  CLI = !v || v === "projectatech" ? "" : v;
  try { localStorage.setItem("cli", CLI); } catch {}
  S = null; mes = null; comentCache = null;
  if ((!CLI && view === "pedidos") || view === "clientes") view = "hoje";
  history.replaceState(null, "", "#" + view);
  $("#view").innerHTML = `<p class="muted">Abrindo…</p>`;
  load().catch(e => { toast(e.message, true); setCli(""); });
}
function switcher() {
  const sel = $("#cli-sel"), cs = S.clientes || [];
  sel.innerHTML = cs.map(c => { const n = c.casa ? 0 : (c.pedidos_novos || 0) + (c.status?.ajuste || 0) + (c.status?.aprovado_cliente || 0);
    return `<option value="${esc(c.slug)}" ${(CLI || "projectatech") === c.slug ? "selected" : ""}>${esc(c.nome)}${n ? ` · ${n}` : ""}</option>`; }).join("")
    + `<option value="__novo">+ Novo cliente…</option>`;
  sel.onchange = () => { if (sel.value === "__novo") { sel.value = CLI || "projectatech"; menu(false); go("clientes"); setTimeout(() => $("#nc-nome")?.focus(), 50); } else setCli(sel.value); };
  const tot = cs.reduce((a, c) => a + (c.casa ? 0 : (c.pedidos_novos || 0) + (c.status?.ajuste || 0) + (c.status?.aprovado_cliente || 0)), 0);

}
function pillsCli() {

function vHojeCli() {
  const now = agoraDate(), P = S.posts, k = S.conexao, c = S.cliente;
  const by = s => P.filter(p => p.status === s);
  const prox = P.filter(p => p.status === "aprovado" && p.data && quando(p) >= now).sort((a,b) => quando(a) - quando(b))[0];
  let cd = "";
  if (prox) { const ms = quando(prox) - now, d = Math.floor(ms/864e5), h = Math.floor(ms/36e5) % 24; cd = d ? `em ${d}d ${h}h` : `em ${h}h ${Math.floor(ms/6e4)%60}min`; }
  const al = [];
  if (!k.conectado) al.push({c:"err", t:"<b>Instagram do cliente não conectado.</b> Sem isso nada é publicado. Abra Conexões.", go:"config"});
  if (!S.voice_ok) al.push({c:"warn", t:`<b>Voz da marca em branco.</b> Preencha <code>clientes/${esc(c.slug)}/voice.md</code> antes de pedir conteúdo ao Claude.`, go:"config"});
  by("ajuste").forEach(p => al.push({c:"err", t:`<b>Ajuste pedido em ${esc(nomePost(p.id))}:</b> “${esc(ultimaFala(p, "cliente").slice(0, 140))}”`, id:p.id}));
  by("aprovado_cliente").forEach(p => al.push({c:"ok", t:`<b>O cliente aprovou ${esc(nomePost(p.id))}.</b> Confira e agende.`, id:p.id}));
  by("erro").forEach(p => al.push({c:"err", t:`<b>${esc(nomePost(p.id))} deu erro ao publicar.</b> ${esc(p.erro || "")}`, id:p.id}));
  S.pedidos.filter(x => x.status === "novo").forEach(x => al.push({c:"warn", t:`<b>Pedido novo · ${esc(TIPOS[x.tipo] || x.tipo)}:</b> ${esc((x.texto || "com anexos").slice(0, 120))}`, go:"pedidos"}));
  P.filter(p => p.status === "aguardando_cliente" && p.data && quando(p) < new Date(now.getTime() + 2*864e5)).forEach(p =>
    al.push({c:"warn", t:`<b>${esc(nomePost(p.id))}</b> sai ${fmt(p.data)} e o cliente ainda não aprovou. Vale lembrar no WhatsApp.`, id:p.id}));
  if (!al.length) al.push({c:"ok", t:"<b>Tudo em ordem.</b> Nada pendente com este cliente."});
  const etapas = [["pendente","Rascunhos","seus, ainda não enviados"],["aguardando_cliente","Com o cliente","esperando aprovação"],["ajuste","Ajustes","o cliente pediu mudança"],["aprovado_cliente","Para agendar","aprovados pelo cliente"],["aprovado","Agendados","saem sozinhos no horário"]];
  $("#view").innerHTML = `
  <div class="grid g3">
    <div class="card ink" style="grid-column:span 2"><p class="tag">Próximo post agendado · @${esc(contaAtual())}</p>
      ${prox ? `<div class="next" style="margin-top:12px">
        <button class="open" data-id="${esc(prox.id)}" style="all:unset;cursor:pointer">${prox.midia[0]?.endsWith(".mp4") ? `<video src="${file(prox.midia[0])}#t=${prox.capa_s||0.1}" muted preload="metadata" style="width:120px;height:150px;object-fit:cover;border-radius:10px"></video>` : `<img src="${file(prox.midia[0])}" alt="Capa de ${esc(nomePost(prox.id))}">`}</button>
        <div><p class="count">${cd}</p><h3 style="font-size:28px;margin-top:6px">${esc(nomePost(prox.id))}</h3>
        <p class="muted">${fmt(prox.data)} às ${prox.hora} · ${prox.tipo}</p>
        <p style="margin-top:10px"><span class="status aprovado">Agendado · aprovado pelo cliente</span></p></div></div>` : `<p class="muted" style="margin-top:12px">Nada agendado ainda. O caminho: criar → enviar ao cliente → ele aprova → você agenda.</p>`}
    </div>
    <div class="card" style="display:flex;flex-direction:column"><p class="tag">Portal do cliente</p><h3>${esc(c.nome)}</h3>
      <p class="muted" style="margin:6px 0 0;font-size:14px">É por ali que o cliente aprova, pede ajuste e manda fotos ou ideias. Mande o link só para ele.</p>
      <div class="inline" style="margin-top:auto;padding-top:16px"><button class="btn accent sm" id="h-copy">Copiar link</button><a class="btn ghost sm" href="${esc(S.portal.replace(/\?k=.*/, ""))}" target="_blank" rel="noopener">Ver como o cliente</a></div></div>
  </div>
  <div class="card" style="margin-top:18px"><p class="tag">Fluxo dos posts</p>
    <div class="fluxo">${etapas.map(([s, t, d]) => `<button class="etapa ${s}" data-st="${s}"><b>${by(s).length}</b><span>${t}</span><small>${d}</small></button>`).join("")}</div></div>
  <div class="grid g2" style="margin-top:18px">
    <div class="card"><p class="tag">O que pede sua atenção</p><ul class="alerts" style="margin-top:12px">${al.map((a,i) => `<li><button class="alert ${a.c}" data-i="${i}">${a.t}</button></li>`).join("")}</ul></div>
    <div class="card"><p class="tag">Criar conteúdo para ${esc(c.nome)}</p>
      <p style="margin:8px 0 0;font-size:15px;line-height:1.5">Peça ao Claude, que já usa a voz da marca e o radar do ramo:</p>
      <ul class="pedir">${[`/agencia ${c.slug} plano do mês`, `/agencia ${c.slug} carrossel sobre [assunto]`, `/agencia ${c.slug} reel narrado sobre [assunto]`, `/agencia ${c.slug} produzir os pedidos novos`].map(t => `<li><code>${esc(t)}</code><button class="btn ghost sm" data-cp="${esc(t)}">Copiar</button></li>`).join("")}</ul>
      <p class="muted" style="font-size:13px;margin:10px 0 0">Os posts entram em <code>clientes/${esc(c.slug)}/posts/</code> e aparecem no Calendário em "Pastas novas".</p></div>
  </div>`;
  $("#h-copy").onclick = () => copiar(S.portal, "Link do portal copiado. Mande só para o cliente.");
  document.querySelectorAll("[data-cp]").forEach(b => b.onclick = () => copiar(b.dataset.cp, "Copiado. Cole no Claude."));
  document.querySelectorAll("[data-st]").forEach(b => b.onclick = () => go("calendario"));
  document.querySelectorAll(".alert").forEach(b => b.onclick = () => { const a = al[b.dataset.i]; if (a.id) openPost(a.id); else if (a.go) go(a.go); });
  bindOpen();
}

  <div class="card" style="margin-top:18px"><p class="tag">Como funciona com o cliente</p>
    <ol class="passos"><li><b>Cadastre</b> e preencha a voz da marca com ele (15 min de conversa).</li><li><b>Mande o link do portal</b> pelo WhatsApp. ${S.nuvem?.oauth ? "Lá ele conecta o Instagram com um toque." : "Para ele conectar o Instagram sozinho, o painel precisa estar na nuvem (veja <code>deploy/LEIA-ME.md</code>). Até lá, conecte em Conexões."}</li>
    <li><b>Crie os posts</b> com o Claude (<code>/agencia</code>) e envie para aprovação.</li><li><b>O cliente aprova</b> ou pede ajuste no celular, e manda fotos e ideias.</li><li><b>Você agenda</b>. O painel publica no horário.</li></ol></div>`;
  document.querySelectorAll("[data-abrir]").forEach(b => b.onclick = () => { view = "hoje"; setCli(b.dataset.abrir); });
  $("#nc").onsubmit = e => { e.preventDefault();
    run($("#nc-go"), () => api("/api/cliente/criar", {nome: $("#nc-nome").value, arroba: $("#nc-arroba").value, ramo: $("#nc-ramo").value, cidade: $("#nc-cidade").value, cta: $("#nc-cta").value}),
      "Cliente criado.").then(r => { if (r) { view = "config"; setCli(r.slug); } }); };
}

function vPedidos() {
  const ps = S.pedidos || [];
  const ordem = {novo:0, em_producao:1, concluido:2, recusado:3};
  $("#view").innerHTML = `<p class="muted" style="margin:0 0 16px;max-width:720px">O que ${esc(S.cliente.nome)} mandou pelo portal: fotos, artes, ideias e pedidos de post. Responda por aqui (o cliente vê no portal) e peça ao Claude para produzir.</p>
  ${ps.length ? `<div class="grid">${[...ps].sort((a,b) => ordem[a.status] - ordem[b.status] || b.criado_em.localeCompare(a.criado_em)).map(x => `<div class="card ped ${x.status}">
    <div class="ped-top"><div><p class="tag">${esc(TIPOS[x.tipo] || x.tipo)} · enviado ${esc(x.criado_em.slice(8,10) + "/" + x.criado_em.slice(5,7) + " " + x.criado_em.slice(11))}${x.data_desejada ? ` · quer para <b>${fmt(x.data_desejada)}</b>` : ""}</p>
      <p style="margin:6px 0 0;font-size:16px;white-space:pre-line">${esc(x.texto) || `<span class="muted">(sem texto, só anexos)</span>`}</p></div>
      <label class="sr" for="ps-${esc(x.id)}">Situação</label><select id="ps-${esc(x.id)}" data-pst="${esc(x.id)}" class="pst">${Object.entries(PST).map(([k,v]) => `<option value="${k}" ${x.status === k ? "selected" : ""}>${v}</option>`).join("")}</select></div>
    ${x.arquivos.length ? `<div class="anexos">${x.arquivos.map(a => /\.(mp4|mov)$/i.test(a) ? `<a href="${file(a)}" target="_blank" rel="noopener" class="anx vid">▶ vídeo</a>` : /\.pdf$/i.test(a) ? `<a href="${file(a)}" target="_blank" rel="noopener" class="anx vid">PDF</a>` : `<a href="${file(a)}" target="_blank" rel="noopener" class="anx"><img src="${file(a)}" alt="Anexo do cliente" loading="lazy"></a>`).join("")}</div>
      <p class="muted" style="font-size:12px;margin:6px 0 0">Arquivos em <code>clientes/${esc(S.cliente.slug)}/${esc(x.arquivos[0].split("/").slice(0,2).join("/"))}/</code></p>` : ""}
    ${(x.conversa || []).length ? `<div class="conversa">${x.conversa.map(m => `<p class="${m.quem === "cliente" ? "dele" : "nossa"}"><b>${m.quem === "cliente" ? esc(S.cliente.nome) : "Você"}</b> ${esc(m.texto)}<small>${esc(m.quando.slice(8,10) + "/" + m.quando.slice(5,7) + " " + m.quando.slice(11))}</small></p>`).join("")}</div>` : ""}
    <div class="inline"><label class="sr" for="pr-${esc(x.id)}">Resposta</label><input type="text" id="pr-${esc(x.id)}" placeholder="Responder ao cliente (aparece no portal)"><button class="btn sm" data-resp="${esc(x.id)}">Responder</button>
      <button class="btn ghost sm" data-cp="/agencia ${esc(S.cliente.slug)} produzir o pedido ${esc(x.id)}">Copiar pedido para o Claude</button></div></div>`).join("")}</div>`
    : `<div class="empty">Nenhum pedido ainda. Quando o cliente mandar uma foto ou ideia pelo portal, aparece aqui.</div>`}`;
  document.querySelectorAll("[data-pst]").forEach(s => s.onchange = () => run(null, () => api("/api/pedido/atualizar", {id: s.dataset.pst, status: s.value}), "Situação atualizada. O cliente vê no portal."));
  document.querySelectorAll("[data-resp]").forEach(b => b.onclick = () => run(b, () => api("/api/pedido/atualizar", {id: b.dataset.resp, resposta: $("#pr-" + b.dataset.resp).value}), "Resposta enviada ao portal."));
  document.querySelectorAll("[data-cp]").forEach(b => b.onclick = () => copiar(b.dataset.cp, "Copiado. Cole no Claude."));
}

function vConfigCli() {
  const c = S.cliente, r = c.regras, k = S.conexao, nv = S.nuvem || {};
  const lista = a => esc((a || []).join(", "));
  const msg = `Olá! Este é o seu portal do Instagram com a Projecta. Por ele você aprova os posts antes de irem ao ar, pede ajustes e manda fotos ou ideias: ${S.portal}`;
  $("#view").innerHTML = `<div class="steps">
  <div class="step ${S.portal ? "done" : ""}"><span class="ic">${S.portal ? "✓" : 1}</span><div><h3>Portal do cliente</h3>
    <p class="muted" style="margin:4px 0 0">Link pessoal: quem tem o link entra no portal de ${esc(c.nome)}. ${nv.ativo ? "Funciona de qualquer lugar." : S.celular?.ativo ? "Funciona na mesma rede Wi-Fi deste PC. Para o cliente abrir de qualquer lugar, publique o painel na nuvem." : "Hoje só abre neste computador. Para o cliente abrir de qualquer lugar, publique o painel na nuvem (<code>deploy/LEIA-ME.md</code>)."}</p>
    <div class="inline"><input type="text" readonly value="${esc(S.portal)}" aria-label="Link do portal" onclick="this.select()"><button class="btn" id="cp-link">Copiar</button></div>
    <div class="inline"><a class="btn ghost sm" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Mandar pelo WhatsApp</a><a class="btn ghost sm" href="${esc(S.portal.replace(/\?k=.*/, ""))}" target="_blank" rel="noopener">Ver como o cliente</a><button class="btn ghost sm" id="cp-nova">Gerar link novo (o antigo para de valer)</button></div></div></div>

  <div class="step ${k.conectado ? "done" : "cur"}"><span class="ic">${k.conectado ? "✓" : 2}</span><div><h3>Instagram do cliente</h3>
    ${k.conectado ? `<p class="muted" style="margin:4px 0 0">Conectado como <b>@${esc(k.username || "?")}</b> · ${k.tipo === "instagram" ? `login do Instagram, renovado sozinho a cada 20 dias (último: ${esc(k.salvo_em)})` : `token colado em ${esc(k.salvo_em)}`}. Fica só em <code>segredos/${esc(c.slug)}.env</code>.</p>
      <div class="inline"><button class="btn ghost sm" id="tk-off">Desconectar</button></div>` :
    nv.oauth ? `<p class="muted" style="margin:4px 0 0">O cliente conecta sozinho: no portal aparece o botão <b>Conectar meu Instagram</b>. Ele faz login no Instagram, autoriza e pronto. Enquanto o app da Meta estiver em desenvolvimento, adicione o @ dele como <b>testador do Instagram</b> no app.</p>` :
    `<p class="muted" style="margin:4px 0 0">${nv.ativo ? "Falta configurar META_APP_ID e META_APP_SECRET (app da Meta com login do Instagram) para o cliente conectar pelo portal." : "A conexão por link (o cliente toca em Conectar e autoriza) precisa do painel na nuvem com HTTPS."} Até lá, cole aqui um token da conta dele:</p>
      <ol><li>No <a href="https://developers.facebook.com/apps/" target="_blank" rel="noopener">app da Meta</a> → API do Instagram com login do Instagram → adicione a conta do cliente e gere o token (começa com IG).</li>
      <li>Ou, se ele te der acesso à Página no Business Suite, gere um token do Login unificado (EAA…) e informe o ID da conta do Instagram.</li></ol>
      <div class="inline"><label class="sr" for="ctk">Token</label><input type="password" id="ctk" placeholder="Cole o token do cliente" autocomplete="off"><label class="sr" for="cuid">ID da conta (só para token EAA)</label><input type="text" id="cuid" placeholder="ID da conta (só se for EAA…)" style="max-width:240px"><button class="btn" id="ctk-go">Salvar e testar</button></div>`}</div></div>

  <div class="step ${nv.ativo || k.media_base_url ? "done" : ""}"><span class="ic">${nv.ativo || k.media_base_url ? "✓" : 3}</span><div><h3>Imagens públicas (carrossel e foto)</h3>
    <p class="muted" style="margin:4px 0 0">O Instagram baixa as imagens por um link público. Reels não precisam disso (vão por upload). ${nv.ativo ? `Na nuvem o próprio painel serve as imagens em <code>${esc(nv.url)}/midia/${esc(c.slug)}/</code>, só depois que o post é agendado.` : "Rodando local, carrossel de cliente só publica com um endereço público para a pasta media do cliente, ou com o painel na nuvem."}</p>
    ${nv.ativo ? "" : `<div class="inline"><label class="sr" for="cmb">Endereço público da mídia</label><input type="url" id="cmb" placeholder="https://… /media (opcional)" value="${esc(k.media_base_url)}"><button class="btn ghost" id="cmb-go">Salvar</button></div>`}</div></div>

  <div class="step done"><span class="ic">✓</span><div><h3>Regras das legendas</h3>
    <p class="muted" style="margin:4px 0 0">A checagem automática usa estas regras antes de enviar ao cliente. Sem preço, sem promessa e sem número inventado valem sempre.</p>
    <form id="rg" class="row2" style="margin-top:12px">
      <div><label for="rg-nome">Nome</label><input type="text" id="rg-nome" value="${esc(c.nome)}"></div>
      <div><label for="rg-arroba">@ do Instagram</label><input type="text" id="rg-arroba" value="${esc(c.arroba)}"></div>
      <div><label for="rg-ramo">Ramo</label><input type="text" id="rg-ramo" value="${esc(c.ramo)}"></div>
      <div><label for="rg-cidade">Cidade</label><input type="text" id="rg-cidade" value="${esc(c.cidade)}"></div>
      <div class="full"><label for="rg-cta">CTA único (a legenda precisa ter)</label><input type="text" id="rg-cta" value="${esc(r.cta)}"></div>
      <div><label for="rg-hash">Hashtags fixas</label><input type="text" id="rg-hash" value="${lista(r.hashtags_fixas)}" placeholder="#lages, #topografia"></div>
      <div><label for="rg-busca">Palavras de busca (uma por legenda)</label><input type="text" id="rg-busca" value="${lista(r.palavras_busca)}" placeholder="topografia, georreferenciamento"></div>
      <div><label for="rg-proib">Palavras fora do tom</label><input type="text" id="rg-proib" value="${lista(r.proibidas)}"></div>
      <div><label for="rg-prom">Promessas proibidas</label><input type="text" id="rg-prom" value="${lista(r.promessas)}"></div>
      <div class="full inline" style="margin:0"><button class="btn" type="submit" id="rg-go">Salvar regras</button></div></form></div></div>

  <div class="step ${S.voice_ok ? "done" : "cur"}"><span class="ic">${S.voice_ok ? "✓" : 5}</span><div><h3>Voz da marca</h3>
    <p class="muted" style="margin:4px 0 0">${S.voice_ok ? "Preenchida." : "Ainda é o modelo."} Arquivo <code>clientes/${esc(c.slug)}/voice.md</code>: público, tom, assuntos que vendem no ramo. As skills <code>/agencia</code> e <code>ig-*</code> leem esse arquivo no lugar do da Projecta. Peça ao Claude: <code>/agencia ${esc(c.slug)} montar a voz da marca</code> com o site e o Instagram do cliente.</p></div></div>
  </div>`;
  $("#cp-link").onclick = () => copiar(S.portal, "Link do portal copiado.");
  $("#cp-nova").onclick = e => confirm("Gerar um link novo? O link antigo para de funcionar.") && run(e.currentTarget, () => api("/api/cliente/nova-chave", {}), "Link novo gerado. Mande para o cliente.");
  $("#tk-off")?.addEventListener("click", e => confirm("Desconectar o Instagram deste cliente?") && run(e.currentTarget, () => api("/api/cliente/desconectar", {}), "Desconectado."));
  $("#ctk-go")?.addEventListener("click", e => { const t = $("#ctk").value; $("#ctk").value = "";
    run(e.currentTarget, () => api("/api/cliente/token", {token: t, user_id: $("#cuid").value}), r => `Conectado como @${r.username}.`); });
  $("#cmb-go")?.addEventListener("click", e => run(e.currentTarget, () => api("/api/cliente/media-base", {url: $("#cmb").value}), "Endereço salvo."));
  $("#rg").onsubmit = e => { e.preventDefault(); run($("#rg-go"), () => api("/api/cliente/salvar", {nome: $("#rg-nome").value, arroba: $("#rg-arroba").value, ramo: $("#rg-ramo").value, cidade: $("#rg-cidade").value,
    regras: {cta: $("#rg-cta").value, hashtags_fixas: $("#rg-hash").value, palavras_busca: $("#rg-busca").value, proibidas: $("#rg-proib").value, promessas: $("#rg-prom").value}}), "Regras salvas."); };
}

const VIEWS = ["hoje","calendario","stories","radar","feed","comentarios","config","clientes","pedidos"];
function celularCard() {
  const c = S.celular || {};
  const noPC = ["127.0.0.1", "localhost"].includes(location.hostname);
  if (!noPC) return `<div class="card" style="margin-top:22px"><p class="tag">Abrir no celular</p><h3>Você está no celular ✓</h3><p class="muted">Conectado pela rede local. O PC precisa ficar ligado com o painel aberto.</p></div>`;
  if (!c.ativo) return `<div class="card" style="margin-top:22px"><p class="tag">Abrir no celular</p><h3>Usar o painel pelo celular</h3>
    <p class="muted">Feche este painel e abra pelo atalho <b>Abrir painel do Instagram (com celular).bat</b>, na pasta PLANO. Um QR code vai aparecer aqui.</p></div>`;
  return `<div class="card" style="margin-top:22px;display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:center">
    <img src="/api/qr" alt="QR code para abrir o painel no celular" style="width:220px;height:220px;background:#fff;border-radius:12px;padding:8px">
    <div><p class="tag">Abrir no celular · modo celular ligado</p><h3>Aponte a câmera do celular para o QR code</h3>
    <ol style="margin:10px 0;padding-left:20px"><li>Celular no Wi-Fi da mesma rede deste PC (endereço do PC: <code>${esc(c.ip || "?")}:${c.porta}</code>).</li>
    <li>Abra o link do QR code. O celular fica liberado (também depois de reiniciar o painel).</li>
    <li>Se não abrir: a rede do PC precisa estar como <b>Privada</b> no Windows e o Python liberado no firewall.</li></ol>
    <p class="muted" style="font-size:13px">O QR code contém uma chave secreta: não compartilhe a foto dele. Fora da sua rede o painel não abre.</p></div></div>`;
}

function go(v) { view = v; history.replaceState(null, "", "#" + v); render(); $("#conteudo").focus({preventScroll:true}); window.scrollTo(0,0); }
document.querySelectorAll(".nav").forEach(b => b.onclick = () => { menu(false); go(b.dataset.view); });
// Menu do celular: abre/fecha a lista de seções; fecha ao escolher, com Esc ou tocando fora.
const aside = $("aside");
function menu(abrir) { aside.classList.toggle("aberto", abrir); $("#menu-btn").setAttribute("aria-expanded", String(abrir)); }
$("#menu-btn").onclick = () => menu(!aside.classList.contains("aberto"));
document.addEventListener("keydown", e => { if (e.key === "Escape" && aside.classList.contains("aberto")) { menu(false); $("#menu-btn").focus(); } });
document.addEventListener("click", e => { if (aside.classList.contains("aberto") && !aside.contains(e.target)) menu(false); });
const dlg = $("#dlg");
dlg.addEventListener("close", () => render());
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
window.addEventListener("hashchange", () => { const v = location.hash.slice(1).split("/")[0]; if (VIEWS.includes(v) && v !== view && S) { view = v; render(); } });
const h0 = location.hash.slice(1).split("/");
if (VIEWS.includes(h0[0])) view = h0[0];
load().then(() => { if (h0[1] && !["stories", "radar"].includes(h0[0])) openPost(decodeURIComponent(h0[1])); })
  .catch(e => $("#view").innerHTML = `<div class="empty">O painel não respondeu: ${esc(e.message)}</div>`);
// Atualiza a cada 60 s, mas nunca enquanto alguém digita: um formulário com texto ou com foco não é redesenhado.
var SUJO = false;
document.addEventListener("input", (e) => { if (e.target.closest("#view")) SUJO = true; });
const digitando = () => { const a = document.activeElement; return SUJO || (a && a.closest("#view") && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); };
setInterval(() => { if (!dlg.open && view !== "comentarios" && !digitando()) load().catch(() => {}); }, 60000);
</script>
</body>
</html>
